<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Site Blocked</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      padding: 20px;
    }
    .icon { font-size: 64px; margin-bottom: 20px; }
    h1 { font-size: 2rem; color: #f87171; margin-bottom: 10px; }
    p  { font-size: 1rem; color: #94a3b8; margin-bottom: 6px; }
    .site { font-size: 1.2rem; color: #fbbf24; font-weight: bold; margin: 10px 0 30px; }
    button {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      margin: 6px;
    }
    button:hover { background: #2563eb; }
    .back { background: #475569; }
    .back:hover { background: #334155; }
  </style>
</head>
<body>
  <div class="icon">🚫</div>
  <h1>Site Blocked</h1>
  <p>You blocked this site to stay productive.</p>
  <div class="site" id="siteName"></div>
  <p style="color:#64748b; font-size:0.85rem; margin-bottom:24px;">
    Stay focused! You can unblock it from the extension popup.
  </p>
  <button id="backBtn" class="back">← Go Back</button>
  <button id="closeBtn">Close Tab</button>

  <script src="blocked.js"></script>
</body>
</html>
